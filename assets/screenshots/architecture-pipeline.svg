<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="blueCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f293d"/>
      <stop offset="100%" stop-color="#141c2b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#58a6ff"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="480" rx="16" fill="url(#bgGrad)" stroke="#30363d" stroke-width="2"/>

  <!-- Title -->
  <text x="480" y="44" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="700">Smart Dark Engine Real-Time Architecture</text>
  <text x="480" y="68" text-anchor="middle" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">Document Start to Final CSSOM Mirroring Pipeline</text>

  <!-- Step 1: Document Start & Rule Extraction -->
  <g transform="translate(40, 100)" filter="url(#cardShadow)">
    <rect width="250" height="130" rx="10" fill="url(#blueCard)" stroke="#388bfd" stroke-width="1.5"/>
    <circle cx="28" cy="28" r="14" fill="#388bfd" fill-opacity="0.2"/>
    <text x="28" y="33" text-anchor="middle" fill="#58a6ff" font-family="sans-serif" font-size="12" font-weight="700">1</text>
    <text x="52" y="32" fill="#f0f6fc" font-family="sans-serif" font-size="14" font-weight="600">Rule Extraction</text>
    <text x="20" y="62" fill="#8b949e" font-family="sans-serif" font-size="11">Extracts active stylesheets</text>
    <text x="20" y="80" fill="#8b949e" font-family="sans-serif" font-size="11">Reads inline style attributes</text>
    <text x="20" y="98" fill="#8b949e" font-family="sans-serif" font-size="11">Document Start injection</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <path d="M 290 165 L 350 165" stroke="#58a6ff" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <polygon points="350,165 342,160 342,170" fill="#58a6ff"/>

  <!-- Step 2: CORS & CDN Resolver -->
  <g transform="translate(355, 100)" filter="url(#cardShadow)">
    <rect width="250" height="130" rx="10" fill="url(#blueCard)" stroke="#388bfd" stroke-width="1.5"/>
    <circle cx="28" cy="28" r="14" fill="#388bfd" fill-opacity="0.2"/>
    <text x="28" y="33" text-anchor="middle" fill="#58a6ff" font-family="sans-serif" font-size="12" font-weight="700">2</text>
    <text x="52" y="32" fill="#f0f6fc" font-family="sans-serif" font-size="14" font-weight="600">CORS Resolver</text>
    <text x="20" y="62" fill="#8b949e" font-family="sans-serif" font-size="11">Detects cross-origin CDN</text>
    <text x="20" y="80" fill="#8b949e" font-family="sans-serif" font-size="11">Service Worker fetch proxy</text>
    <text x="20" y="98" fill="#8b949e" font-family="sans-serif" font-size="11">Raw CSS returned to tab</text>
  </g>

  <!-- Arrow 2 to 3 -->
  <path d="M 605 165 L 665 165" stroke="#58a6ff" stroke-width="2" fill="none"/>
  <polygon points="665,165 657,160 657,170" fill="#58a6ff"/>

  <!-- Step 3: Perceptual HSL Math -->
  <g transform="translate(670, 100)" filter="url(#cardShadow)">
    <rect width="250" height="130" rx="10" fill="url(#blueCard)" stroke="#388bfd" stroke-width="1.5"/>
    <circle cx="28" cy="28" r="14" fill="#388bfd" fill-opacity="0.2"/>
    <text x="28" y="33" text-anchor="middle" fill="#58a6ff" font-family="sans-serif" font-size="12" font-weight="700">3</text>
    <text x="52" y="32" fill="#f0f6fc" font-family="sans-serif" font-size="14" font-weight="600">Perceptual HSL Math</text>
    <text x="20" y="62" fill="#8b949e" font-family="sans-serif" font-size="11">Preserves original hue (H)</text>
    <text x="20" y="80" fill="#8b949e" font-family="sans-serif" font-size="11">Lightness compressed to 8-18%</text>
    <text x="20" y="98" fill="#8b949e" font-family="sans-serif" font-size="11">Text lightness mapped to 80-90%</text>
  </g>

  <!-- Downward Transition Line -->
  <path d="M 795 230 L 795 285 L 165 285 L 165 315" stroke="#58a6ff" stroke-width="2" fill="none" stroke-dasharray="6,4"/>
  <polygon points="165,315 160,307 170,307" fill="#58a6ff"/>

  <!-- Step 4: Surface Harmonizer & SVG Guard -->
  <g transform="translate(40, 315)" filter="url(#cardShadow)">
    <rect width="250" height="130" rx="10" fill="url(#blueCard)" stroke="#238636" stroke-width="1.5"/>
    <circle cx="28" cy="28" r="14" fill="#238636" fill-opacity="0.2"/>
    <text x="28" y="33" text-anchor="middle" fill="#3fb950" font-family="sans-serif" font-size="12" font-weight="700">4</text>
    <text x="52" y="32" fill="#f0f6fc" font-family="sans-serif" font-size="14" font-weight="600">Surface Harmonizer</text>
    <text x="20" y="62" fill="#8b949e" font-family="sans-serif" font-size="11">Neutralizes dynamic white tabs</text>
    <text x="20" y="80" fill="#8b949e" font-family="sans-serif" font-size="11">Forces currentColor on SVG icons</text>
    <text x="20" y="98" fill="#8b949e" font-family="sans-serif" font-size="11">Overrides framework tokens</text>
  </g>

  <!-- Arrow 4 to 5 -->
  <path d="M 290 380 L 350 380" stroke="#3fb950" stroke-width="2" fill="none"/>
  <polygon points="350,380 342,375 342,385" fill="#3fb950"/>

  <!-- Step 5: Media Protection -->
  <g transform="translate(355, 315)" filter="url(#cardShadow)">
    <rect width="250" height="130" rx="10" fill="url(#blueCard)" stroke="#238636" stroke-width="1.5"/>
    <circle cx="28" cy="28" r="14" fill="#238636" fill-opacity="0.2"/>
    <text x="28" y="33" text-anchor="middle" fill="#3fb950" font-family="sans-serif" font-size="12" font-weight="700">5</text>
    <text x="52" y="32" fill="#f0f6fc" font-family="sans-serif" font-size="14" font-weight="600">Media Protection</text>
    <text x="20" y="62" fill="#8b949e" font-family="sans-serif" font-size="11">Photos and videos never inverted</text>
    <text x="20" y="80" fill="#8b949e" font-family="sans-serif" font-size="11">Gentle brightness limiter</text>
    <text x="20" y="98" fill="#8b949e" font-family="sans-serif" font-size="11">Fullscreen native bypass</text>
  </g>

  <!-- Arrow 5 to 6 -->
  <path d="M 605 380 L 665 380" stroke="#3fb950" stroke-width="2" fill="none"/>
  <polygon points="665,380 657,375 657,385" fill="#3fb950"/>

  <!-- Step 6: Mirror Stylesheet Injection -->
  <g transform="translate(670, 315)" filter="url(#cardShadow)">
    <rect width="250" height="130" rx="10" fill="url(#blueCard)" stroke="#8957e5" stroke-width="1.5"/>
    <circle cx="28" cy="28" r="14" fill="#8957e5" fill-opacity="0.2"/>
    <text x="28" y="33" text-anchor="middle" fill="#a371f7" font-family="sans-serif" font-size="12" font-weight="700">6</text>
    <text x="52" y="32" fill="#f0f6fc" font-family="sans-serif" font-size="14" font-weight="600">DOM Mirror Injected</text>
    <text x="20" y="62" fill="#8b949e" font-family="sans-serif" font-size="11">Zero layout coordinate distortion</text>
    <text x="20" y="80" fill="#8b949e" font-family="sans-serif" font-size="11">MutationObserver active sync</text>
    <text x="20" y="98" fill="#8b949e" font-family="sans-serif" font-size="11">Instant live theme switching</text>
  </g>
</svg>